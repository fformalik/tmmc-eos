function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open_(pw){
  var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},key,u(C));
  var html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem("tmmc_pw",pw)}catch(e){}
  document.open();document.write(html);document.close();
}
async function go(pw){
  document.getElementById("b").textContent="Opening…";
  try{await open_(pw)}catch(e){try{sessionStorage.removeItem("tmmc_pw")}catch(_){}
    document.getElementById("b").textContent="Open";document.getElementById("err").textContent="Wrong password.";}
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();go(document.getElementById("pw").value)});
